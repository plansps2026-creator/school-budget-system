name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: school_budget
          POSTGRES_USER: school_budget
          POSTGRES_PASSWORD: school_budget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U school_budget -d school_budget"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://school_budget:school_budget@localhost:5432/school_budget?schema=public
      JWT_SECRET: ci-only-secret-change-this-to-a-long-random-value
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run build
      - run: npm test
      - name: Start API for UAT
        run: |
          nohup node apps/api/dist/main.js > /tmp/school-budget-api.log 2>&1 &
          for i in {1..30}; do curl -fsS http://localhost:4000/api/health && break || sleep 2; done
      - run: npm run uat:smoke
      - run: npm run security:gate
